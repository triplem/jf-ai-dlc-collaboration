name: Docs

# Publish docs/ to GitHub Pages with MkDocs Material.
# One-time setup: repo Settings → Pages → Source = "GitHub Actions".

on:
  push:
    branches: [main]
    paths: ["docs/**", "mkdocs.yml", ".github/workflows/docs.yml", ".github/tools/rewrite-doc-links.mjs"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: pages
        uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Rewrite the docs' repo-relative links to absolute URLs for the site
      # (committed docs keep relative links for GitHub browsing).
      - run: node .github/tools/rewrite-doc-links.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install "mkdocs-material>=9,<10"
      - run: mkdocs build
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
