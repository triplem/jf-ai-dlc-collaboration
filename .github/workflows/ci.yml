name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  generators:
    # The terraform-derived artifacts must be reproducible from upstream/collab.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/gen-routes.mjs
      - run: node scripts/gen-tables.mjs
      - name: routes.json / tables.json are in sync with the terraform
        run: git diff --exit-code overlay/api-router/routes.json overlay/bootstrap/tables.json

  patches:
    # overlay/patches/*.patch must apply cleanly onto the pristine upstream/collab
    # subtree (they are applied at image BUILD time — see docs/patches.md). This
    # catches a patch broken by upstream drift, fast and without Docker.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: overlay/patches apply cleanly onto pristine upstream
        run: scripts/apply-patches.sh
      - name: applied diff (sanity — non-empty)
        run: git diff --stat -- upstream/collab

  tests:
    # dynamo-pg + durable emulator suites (testcontainers → Docker on the runner).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: overlay/dynamo-pg
      - run: npm test
        working-directory: overlay/dynamo-pg
      - run: npm ci
        working-directory: overlay/durable
      - run: npm test
        working-directory: overlay/durable

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/jf-ai-dlc

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f deploy/compose/docker-compose.yml config -q
