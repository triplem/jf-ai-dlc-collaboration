apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-env
  labels: {{ include "jf.labels" . | nindent 4 }}
data:
  AWS_ACCESS_KEY_ID: local
  AWS_SECRET_ACCESS_KEY: local
  AWS_REGION: us-east-1
  AWS_ENDPOINT_URL_DYNAMODB: http://{{ .Release.Name }}-dynamo-pg:8000
  DYNAMODB_LOCAL_ENDPOINT: http://{{ .Release.Name }}-dynamo-pg:8000
  AWS_ENDPOINT_URL_S3: {{ .Values.endpoints.s3 | quote }}
  AWS_ENDPOINT_URL_SSM: http://{{ .Release.Name }}-aws-shim:3004
  AWS_ENDPOINT_URL_SECRETS_MANAGER: http://{{ .Release.Name }}-aws-shim:3004
  AWS_ENDPOINT_URL_LAMBDA: http://{{ .Release.Name }}-aws-shim:3004
  AWS_ENDPOINT_URL_PRICING: http://{{ .Release.Name }}-aws-shim:3004
  AWS_ENDPOINT_URL_COGNITO_IDENTITY_PROVIDER: http://{{ .Release.Name }}-aws-shim:3004
  AWS_ENDPOINT_URL_BEDROCK_AGENTCORE: http://{{ .Release.Name }}-session-runner:3003
  NEPTUNE_ENDPOINT: {{ .Values.endpoints.gremlinHost | quote }}
  GREMLIN_PORT: {{ .Values.endpoints.gremlinPort | quote }}
  GREMLIN_PROTOCOL: ws
  WEBSOCKET_ENDPOINT: http://{{ .Release.Name }}-ws-gateway:3002
  ARTIFACTS_BUCKET: {{ .Values.artifactsBucket | quote }}
  AGENTCORE_RUNTIME_ARN: arn:aws:bedrock-agentcore:local:000000000000:runtime/{{ .Release.Name }}
  # Durable orchestrator: intent-start invokes this function, which aws-shim
  # runs as a durable execution (overlay/durable).
  V2_ORCHESTRATOR_FUNCTION: v2-orchestrator
  SOURCE_CONTROL_FUNCTION: source-control
  # AgentCore invokes this lambda (via aws-shim) at each git network op to mint a
  # short-lived clone credential from the user's stored OAuth token. Unset ->
  # init-ws clone fails with "init_ws_failed: checkout_failed".
  CREDENTIAL_BROKER_FUNCTION: credential-broker
  # cognito-users guards on this; aws-shim ignores the value and lists Keycloak.
  COGNITO_USER_POOL_ID: {{ .Values.auth.realm | quote }}
  OIDC_ISSUER: {{ .Values.endpoints.oidcIssuer | quote }}
  OIDC_JWKS_URL: {{ .Values.endpoints.keycloakInternal }}/realms/{{ .Values.auth.realm }}/protocol/openid-connect/certs
  KC_URL: {{ .Values.endpoints.keycloakInternal | quote }}
  KC_REALM: {{ .Values.auth.realm | quote }}
  KC_ADMIN_CLIENT_ID: {{ .Values.auth.adminClientId | quote }}
  # Secrets-Manager slot ids for the tracker/git OAuth-app credential pairs.
  # The trackers handler (api-router) writes {client_id, client_secret} here from
  # the Admin panel and reads it back for the OAuth flow (store = aws-shim). These
  # are non-sensitive ids; the credential pair itself is created on first write.
  GITHUB_OAUTH_SECRET_NAME: {{ printf "%s-github-oauth-%s" .Values.naming.projectName .Values.naming.environment | quote }}
  GITLAB_OAUTH_SECRET_NAME: {{ printf "%s-gitlab-oauth-%s" .Values.naming.projectName .Values.naming.environment | quote }}
  BITBUCKET_OAUTH_SECRET_NAME: {{ printf "%s-bitbucket-oauth-%s" .Values.naming.projectName .Values.naming.environment | quote }}
  JIRA_OAUTH_SECRET_NAME: {{ printf "%s-jira-oauth-%s" .Values.naming.projectName .Values.naming.environment | quote }}
  # OAuth redirect URIs the backend sends to each provider; register each one
  # verbatim as the provider app's "Authorization callback URL" (they match
  # exactly). Canonical app origin = the ingress host, per terraform's
  # ${app_url}/<callback>. If you front the app on a different domain, override.
  GITHUB_REDIRECT_URI: {{ printf "https://%s/github/callback" .Values.ingress.host | quote }}
  GITLAB_REDIRECT_URI: {{ printf "https://%s/gitlab/callback" .Values.ingress.host | quote }}
  BITBUCKET_REDIRECT_URI: {{ printf "https://%s/bitbucket/callback" .Values.ingress.host | quote }}
  JIRA_REDIRECT_URI: {{ printf "https://%s/trackers/callback/jira-cloud" .Values.ingress.host | quote }}
  # SSM path prefix for stored git OAuth tokens. The connect flow builds
  # /<prefix>/<userId>/<provider>; the validator requires 4-5 segments, so the
  # prefix must be <project>/<env>/git-token (terraform shape). Unset -> a
  # 500 on the repo list after connecting.
  GIT_TOKEN_SSM_PREFIX: {{ printf "%s/%s/git-token" .Values.naming.projectName .Values.naming.environment | quote }}
  # SSM base prefix (/<project>/<env>) for agent settings + custom-MCP-server
  # config/secrets. Unset degrades gracefully; set so those features persist.
  AGENT_SETTINGS_SSM_PREFIX: {{ printf "/%s/%s" .Values.naming.projectName .Values.naming.environment | quote }}
  MCP_SECRETS_SSM_PREFIX: {{ printf "/%s/%s" .Values.naming.projectName .Values.naming.environment | quote }}
  {{- include "jf.tables" . | nindent 2 }}
