{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  labels: {{ include "jf.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- with .Values.ingress.tls }}
  tls: {{ toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-api-router
                port:
                  number: 3001
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-ws-gateway
                port:
                  number: 3002
          - path: /yjs
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-yjs-server
                port:
                  number: 1234
{{- end }}
